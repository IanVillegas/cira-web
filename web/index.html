<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIRA</title>
    <meta name="theme-color" content="#f5f5f7" />
    <!-- App instalable (PWA): sin el manifiesto, "Instalar app" de Chrome abre con la barra de la URL. -->
    <!-- use-credentials: el túnel (Dev Tunnels) solo entrega archivos a quien ya aceptó su aviso (cookie);
         sin esto Chrome pide el manifiesto sin cookie, recibe la página de aviso y no deja instalar. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CIRA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Aplica el tema guardado antes de pintar, para que el modo oscuro no parpadee en claro. -->
    <script>
      try {
        var t = localStorage.getItem("cira.tema");
        var o = t === "oscuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = o ? "dark" : "light";
        document.documentElement.style.colorScheme = o ? "dark" : "light";
      } catch (e) {}
    </script>
    <meta name="description" content="CIRA — conecta trabajos con trabajadores cerca de ti." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
